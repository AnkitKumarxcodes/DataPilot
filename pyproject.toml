[project]
name = "dataagent"
version = "0.1.0"
description = "End-to-end Data Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "ipython>=9.17.1",
    "langchain",
    "langchain-google-genai",
    "langchain-groq",
    "langchain-openrouter",
    "langgraph",
    "pandas>=3.1.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.12.5",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
